# TiTaN — Railway deployment manifest (equivalent to railway.json; keep both).
# `PORT` is always taken from the environment: the entrypoint reads it, so the
# service works on Railway, Fly, Render and plain Docker without edits.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**", "frontend/**", "docker/**", "Dockerfile", "nginx/**"]

[deploy]
startCommand = "/usr/local/bin/titan-entrypoint serve"
healthcheckPath = "/healthz"
healthcheckTimeout = 45
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
sleepApplication = false
overlapSeconds = 10
drainingSeconds = 5

[environments.production.variables]
ENV = "production"
TITAN_STATE_DIR = "/data/state"
DATA_DIR = "/data"
GEOIP_PROVIDER = "ipwhois"
TITAN_SKIP_MIGRATIONS = "0"
